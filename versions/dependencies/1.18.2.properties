# Mojmap, not Yarn: the whole matrix (1.18.2 through 26.2) is ported against
# official Mojang mappings uniformly, not split into a Yarn-era/Mojmap-era
# codebase. Loom's officialMojangMappings() works for any MC version back to
# ~1.14, so there's no structural need for Yarn here even though this version
# predates the 1.21.4/26.2 cells that forced the mapping choice for other
# reasons (see 1.21.4.properties). Omitting yarn_mappings makes Stonecraft
# default to loom.officialMojangMappings() for both the fabric and forge cells.
minecraft_version=1.18.2
loader_version=0.19.3

# Fabric API
fabric_version=0.77.0+1.18.2

# Forge
forge_version=1.18.2-40.3.12
