# Deliberately Mojmap, not Yarn: this node has a NeoForge cell, and Architectury's
# yarn-mappings-patch-neoforge artifact (required to use Yarn + NeoForge together)
# does not exist for 1.21.4 -- checked live against
# https://maven.architectury.dev/dev/architectury/yarn-mappings-patch-neoforge/maven-metadata.xml,
# whose newest patches top out at 1.21+build.6 / 1.20.5 / 1.20.6. Omitting
# yarn_mappings makes Stonecraft default to loom.officialMojangMappings() for
# both the fabric and neoforge cells of this MC version, which sidesteps the
# missing-artifact problem entirely.
minecraft_version=1.21.4
loader_version=0.19.3

# Fabric API
fabric_version=0.119.4+1.21.4

# NeoForge
neoforge_version=21.4.157
